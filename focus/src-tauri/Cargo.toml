[package]
name = "focus"
version = "0.4.0"
description = "Focus – local-first productivity"
edition = "2021"
rust-version = "1.80"

[lib]
name = "focus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "=2.7.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tauri-plugin-deep-link = "=2.6.3"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
keyring = "4.2"
# Local API (Phase 4): desktop only, off by default.
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
